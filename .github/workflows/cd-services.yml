# Backend Services CD Pipeline (GitOps via ArgoCD)
#
# 빌드 → Artifact Registry push → k8s/charts/parkgolf/values.yaml 의 image tag 갱신 → git commit
# ArgoCD가 변경 감지 후 자동 sync (5분 이내).
#
# Prerequisites:
#   1. GKE Standard 클러스터 + ArgoCD + External Secrets 설치 완료
#   2. GCP Secret Manager에 parkgolf-dev-* 시크릿 등록
#   3. GitHub Secret: GCP_SA_KEY

name: CD Services

permissions:
  contents: write

concurrency:
  group: cd-services-${{ github.event.inputs.environment }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, prod]
        default: 'dev'
      services:
        description: 'Services to build (comma-separated or "all")'
        required: true
        default: 'all'
        type: string

env:
  REGION: asia-northeast3
  REGISTRY: asia-northeast3-docker.pkg.dev
  PROJECT_ID: parkgolf-uniyous

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Set Environment
        id: env
        run: echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Set Services
        id: services
        run: |
          INPUT="${{ github.event.inputs.services }}"
          if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
            SERVICES="iam-service,club-service,booking-service,billing-service,chat-service,notify-service,marketplace-saga-service,partner-service,manager-bff,consumer-bff,chat-gateway,weather-service,location-service,job-service,concierge-service,manager-saga-service,payment-service"
          else
            SERVICES="$INPUT"
          fi
          MATRIX=$(echo $SERVICES | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -s -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Resolve Service Path
        id: resolve
        run: |
          SERVICE="${{ matrix.service }}"
          # 서비스 → 제품 폴더 매핑 (UNI-112 폴더 재구조화)
          case "$SERVICE" in
            marketplace-saga-service|booking-service|billing-service|consumer-bff|concierge-service|chat-service|chat-gateway|partner-service)
              PRODUCT="marketplace" ;;
            manager-bff|club-service|manager-saga-service|payment-service)
              PRODUCT="manager" ;;
            iam-service|notify-service|location-service|weather-service|job-service)
              PRODUCT="platform" ;;
            *)
              echo "::error::Unknown service (no product mapping): $SERVICE"; exit 1 ;;
          esac
          SVC_DIR="$PRODUCT/services/$SERVICE"
          if [ -d "$SVC_DIR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "svc_dir=$SVC_DIR" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Service directory not found: $SVC_DIR"
          fi

      - name: Build & Push
        if: steps.resolve.outputs.exists == 'true'
        run: |
          SERVICE="${{ matrix.service }}"
          ENV=${{ needs.setup.outputs.environment }}
          SVC_DIR="${{ steps.resolve.outputs.svc_dir }}"

          IMAGE_NAME="$SERVICE"
          # shared/packages(file: 의존) 포함 서비스는 레포 루트를 빌드 컨텍스트로 (Dockerfile 주석 참조)
          case "$SERVICE" in
            marketplace-saga-service|manager-saga-service|payment-service|billing-service) CONTEXT="." ;;
            *) CONTEXT="$SVC_DIR" ;;
          esac

          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/parkgolf/$IMAGE_NAME
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:${ENV}-latest \
            -f $SVC_DIR/Dockerfile "$CONTEXT"
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:${ENV}-latest

  update-manifest:
    name: Update Helm values & commit
    needs: [setup, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in env values
        run: |
          ENV=${{ needs.setup.outputs.environment }}
          NEW_TAG=${{ github.sha }}
          SERVICES_JSON='${{ needs.setup.outputs.matrix }}'
          INPUT_SERVICES="${{ github.event.inputs.services }}"

          # 서비스 → 제품 차트 매핑 (UNI-112: values가 <product>/infra/k8s/ 로 분산)
          product_of() {
            case "$1" in
              marketplace-saga-service|booking-service|billing-service|consumer-bff|concierge-service|chat-service|chat-gateway|partner-service) echo marketplace ;;
              manager-bff|club-service|manager-saga-service|payment-service) echo manager ;;
              iam-service|notify-service|location-service|weather-service|job-service) echo platform ;;
              *) echo "" ;;
            esac
          }

          # 빌드된 service의 tag를 해당 제품 values 파일에 라우팅
          for svc in $(echo "$SERVICES_JSON" | jq -r '.[]'); do
            P=$(product_of "$svc")
            if [ -z "$P" ]; then echo "::warning::no product mapping for $svc"; continue; fi
            VF="$P/infra/k8s/values-${ENV}.yaml"
            cur=$(yq '.serviceImageTags' "$VF")
            if [ "$cur" = "null" ] || [ -z "$cur" ]; then yq -i '.serviceImageTags = {}' "$VF"; fi
            yq -i ".serviceImageTags.\"$svc\" = \"${NEW_TAG}\"" "$VF"
            echo "Updated $VF: serviceImageTags.$svc = $NEW_TAG"
          done

          # services=all → 전 제품 values의 global.image.tag fallback도 갱신
          if [ "$INPUT_SERVICES" = "all" ] || [ -z "$INPUT_SERVICES" ]; then
            for P in platform marketplace manager; do
              yq -i ".global.image.tag = \"${NEW_TAG}\"" "$P/infra/k8s/values-${ENV}.yaml"
              echo "Updated $P/infra/k8s/values-${ENV}.yaml: global.image.tag = $NEW_TAG"
            done
          else
            echo "Skipped global.image.tag update (services=$INPUT_SERVICES, not all)"
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ENV=${{ needs.setup.outputs.environment }}
          git add platform/infra/k8s/values-${ENV}.yaml marketplace/infra/k8s/values-${ENV}.yaml manager/infra/k8s/values-${ENV}.yaml
          if git diff --cached --quiet; then
            echo "No changes — skip commit"
          else
            git commit -m "chore(cd-${{ needs.setup.outputs.environment }}): bump image tag to ${{ github.sha }} [skip ci]"
            git push
          fi

  summary:
    name: Summary
    needs: [setup, build-and-push, update-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print
        run: |
          ENV=${{ needs.setup.outputs.environment }}
          SHA=${{ github.sha }}
          {
            echo "## CD Services — $ENV"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Image tag | \`$SHA\` |"
            echo "| Tags pushed | \`$SHA\`, \`${ENV}-latest\` |"
            echo "| Helm values updated | \`{platform,marketplace,manager}/infra/k8s/values-${ENV}.yaml\` |"
            echo "| Build result | ${{ needs.build-and-push.result }} |"
            echo "| Manifest commit result | ${{ needs.update-manifest.result }} |"
            echo ""
            echo "ArgoCD auto-sync (≤5분). 진행 확인:"
            echo "\`\`\`"
            echo "kubectl -n argocd get application -l app.kubernetes.io/part-of=parkgolf || kubectl -n argocd get applications"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
