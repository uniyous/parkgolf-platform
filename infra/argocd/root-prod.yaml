# app-of-apps 루트 (prod) — infra/argocd/apps/prod/ 의 제품별 Application을 관리.
# 부트스트랩: kubectl apply -f infra/argocd/root-prod.yaml (최초 1회)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parkgolf-root-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/uniyous/parkgolf-platform.git
    targetRevision: main
    path: infra/argocd/apps/prod
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # prod 루트도 자동(child app 생성만) — 실제 워크로드 sync는 각 child가 수동
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
